name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint + test
  # requirements-test.txt = requirements-ci.txt plus opencv-headless, which
  # utils/homography.py needs at import time. It is a separate file because the
  # Dockerfile installs requirements-ci.txt, and the API image has no use for
  # OpenCV. Still no torch/paddlepaddle — tests/test_detection stays out.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_detection

  # ---------------------------------------------------------------------------
  # Docker: build image (no push — just verify it builds)
  # Runs independently of backend so a lint failure doesn't block docker check.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker — build image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pitchvision-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Dashboard: type-check
  # ---------------------------------------------------------------------------
  dashboard:
    name: Dashboard — type check + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: dashboard
        run: npm test
